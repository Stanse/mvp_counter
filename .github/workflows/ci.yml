name: CI

# No emulator, no model files - build + JVM tests + detekt/ktlint only, per
# REPCOUNTER_ANDROID.md §16. Level 3 (instrumented) tests are nightly/manual, not here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install required SDK platforms
        run: sdkmanager "platforms;android-37.1" "platforms;android-36.1"

      - name: Placeholder model assets
        # Level 1/2 tests and assemble don't need real models (spec §3.4), but the assets
        # directory itself must exist for the app module's resource merge to succeed.
        run: mkdir -p app/src/main/assets/models

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint, module-boundary check
        run: ./gradlew build verifyModuleBoundaries --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          retention-days: 7
